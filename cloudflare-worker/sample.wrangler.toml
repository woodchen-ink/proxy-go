name = "proxy-go-sync"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# 中控管理域名 (czl.net 在同账号下, Custom Domain 自动建 DNS 与证书)
routes = [
  { pattern = "i-manage.czl.net", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "proxy-go-data"
database_id = ""

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# DO 常驻 (节点快照每 15s 一次) 永远等不到休眠, 默认会推迟 300s 才换新代码; 缩短到 60s
[durable_objects.code_update_strategy]
mode = "deferred"
max_delay = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# 管理前端: web/ 的 Next.js 静态导出; Worker 先行, 由 index.ts 剥掉 /admin 前缀后取资源
[assets]
directory = "../web/out"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# 密钥全部用 wrangler secret put 设置, 见 src/env.ts

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
