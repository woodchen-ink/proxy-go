services:
  proxy:
    image: ghcr.io/woodchen-ink/proxy-go:latest
    container_name: proxy-go
    ports:
      - "3336:3336"
    volumes:
      - ./data:/app/data   # 配置快照 / 节点 ID / 指令游标 / 缓存
    environment:
      - TZ=Asia/Shanghai
      # 中控 (cloudflare-worker) 地址与令牌; 管理后台在中控上, 节点不带管理界面
      - D1_SYNC_ENABLED=true
      - D1_SYNC_URL=https://proxy-go-sync.your-subdomain.workers.dev
      - D1_SYNC_TOKEN=your_api_token
      # 可选: 中控 WebSocket 地址, 缺省沿用 D1_SYNC_URL
      # - CONTROL_URL=https://i-manage.example.com
      # 可选: 固定节点 ID, 缺省按出口 IP 生成并固化到 data/node_id
      # - NODE_ID=node-1
      # 可选: favicon 代理地址
      # - FAVICON_URL=https://example.com/favicon.ico
    restart: always
