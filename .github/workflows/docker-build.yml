name: Build and Push Docker Image

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md','docker-compose.yml' ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          # 构建时刻而非提交时间: 同一提交的 main 构建与 tag 构建也要能区分 (自更新据此判断镜像是否换过)
          BUILD_TIME=$(date +%s)
          go build -ldflags "-X proxy-go/internal/control.Version=${GITHUB_SHA::7} -X proxy-go/internal/control.BuildTime=${BUILD_TIME}" -o proxy-go-${{ matrix.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-go-${{ matrix.arch }}
          path: proxy-go-${{ matrix.arch }}

  docker:
    needs: [build-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Create Docker build context
        run: |
          mkdir -p docker-context
          cp Dockerfile docker-context/
          cp proxy-go-amd64/proxy-go-amd64 docker-context/proxy-go.amd64
          cp proxy-go-arm64/proxy-go-arm64 docker-context/proxy-go.arm64
  
      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 发布节点程序供中控滚动升级: 每个 main 提交一个 build-<sha7> Release (只保留最近 20 个),
  # 然后把版本登记到中控。节点增减都在中控页面里管理, 这里不随节点变化
  release:
    needs: [build-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=${GITHUB_SHA::7}
          TAG="build-${VERSION}"
          mkdir -p dist
          cp proxy-go-amd64/proxy-go-amd64 dist/proxy-go-linux-amd64
          cp proxy-go-arm64/proxy-go-arm64 dist/proxy-go-linux-arm64
          (cd dist && sha256sum proxy-go-linux-* > SHA256SUMS)
          TITLE=$(git log -1 --format=%s)
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --title "$TAG" --notes "$TITLE" || gh release upload "$TAG" dist/* --clobber
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Register release with control panel
        env:
          CONTROL_URL: ${{ secrets.CONTROL_URL }}
          CONTROL_API_TOKEN: ${{ secrets.CONTROL_API_TOKEN }}
          VERSION: ${{ steps.rel.outputs.version }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -e
          if [ -z "$CONTROL_URL" ] || [ -z "$CONTROL_API_TOKEN" ]; then
            echo "::warning::未配置 CONTROL_URL / CONTROL_API_TOKEN, 中控看不到这个版本, 只能手动在 Dokploy 更新"
            exit 0
          fi
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          asset() {
            local f="dist/proxy-go-linux-$1"
            jq -n --arg url "$BASE/proxy-go-linux-$1" --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$f")" '{url: $url, sha256: $sha, size: $size}'
          }
          BODY=$(jq -n --arg version "$VERSION" --argjson build_time "$(date +%s)" --arg title "$(git log -1 --format=%s)" --argjson amd64 "$(asset amd64)" --argjson arm64 "$(asset arm64)" '{version: $version, build_time: $build_time, title: $title, assets: {amd64: $amd64, arm64: $arm64}}')
          curl -fsS -X POST "${CONTROL_URL%/}/node/releases" -H "Authorization: Bearer $CONTROL_API_TOKEN" -H "Content-Type: application/json" -d "$BODY"

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[20:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag || true
          done
