name: Build and Push Docker Image

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md','docker-compose.yml' ]
  pull_request:
    branches: [ main ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out

  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -o proxy-go-${{ matrix.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-go-${{ matrix.arch }}
          path: proxy-go-${{ matrix.arch }}

  docker:
    needs: [build-web, build-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Create Docker build context
        run: |
          mkdir -p docker-context
          cp Dockerfile docker-context/
          cp proxy-go-amd64/proxy-go-amd64 docker-context/proxy-go.amd64
          cp proxy-go-arm64/proxy-go-arm64 docker-context/proxy-go.arm64
          mkdir -p docker-context/web/out
          cp -r web-out/* docker-context/web/out/
  
      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 每个 dokploy 应用有各自的 webhook, 多节点部署需要逐个触发;
      # 漏掉一个会让该节点长期停在旧镜像上, 与其他节点行为不一致
      - name: Trigger Dokploy deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          DOKPLOY_WEBHOOK_URL_DE: ${{ secrets.DOKPLOY_WEBHOOK_URL_DE }}
        run: |
          triggered=0
          failed=0
          for hook in "$DOKPLOY_WEBHOOK_URL" "$DOKPLOY_WEBHOOK_URL_DE"; do
            [ -z "$hook" ] && continue
            # 单个节点触发失败不阻断其余节点, 但要在末尾汇总为失败, 避免静默漏部署
            if curl -fsSL -X POST "$hook" \
                 -H "Content-Type: application/json" \
                 -d "{\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}"; then
              triggered=$((triggered + 1))
            else
              echo "::warning::某个 dokploy webhook 触发失败"
              failed=$((failed + 1))
            fi
          done
          echo "已触发 $triggered 个节点, 失败 $failed 个"
          if [ "$triggered" -eq 0 ]; then
            echo "::error::没有配置任何 dokploy webhook, 所有节点都不会更新"
            exit 1
          fi
          [ "$failed" -gt 0 ] && exit 1
          exit 0
