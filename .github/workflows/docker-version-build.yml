name: Build and Push Docker Image

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    tags:
      - 'v*'
    paths-ignore: [ '**.md','docker-compose.yml' ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          # 构建时刻而非提交时间: 同一提交的 main 构建与 tag 构建也要能区分 (自更新据此判断镜像是否换过)
          BUILD_TIME=$(date +%s)
          go build -ldflags "-X proxy-go/internal/control.Version=${GITHUB_REF_NAME} -X proxy-go/internal/control.BuildTime=${BUILD_TIME}" -o proxy-go-${{ matrix.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-go-${{ matrix.arch }}
          path: proxy-go-${{ matrix.arch }}

  docker:
    needs: [build-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=stable

      - name: Create Docker build context
        run: |
          mkdir -p docker-context
          cp Dockerfile docker-context/
          cp proxy-go-amd64/proxy-go-amd64 docker-context/proxy-go.amd64
          cp proxy-go-arm64/proxy-go-arm64 docker-context/proxy-go.arm64
  
      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
